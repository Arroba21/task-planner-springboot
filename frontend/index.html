<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda de Tareas</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <span class="navbar-brand fw-bold">📅 Agenda</span>
      <span class="text-muted small">Agenda + horas (Full-stack)</span>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-3">
      <!-- Columna izquierda: Form + Lista -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm pop">
          <div class="card-body">
            <h5 class="card-title mb-3">Nueva tarea</h5>

            <form id="form">
              <div class="mb-2">
                <label class="form-label">Título</label>
                <input id="title" class="form-control" maxlength="80" required placeholder="Ej: Entreno">
              </div>

              <div class="mb-2">
                <label class="form-label">Descripción</label>
                <input id="desc" class="form-control" maxlength="240" placeholder="Ej: 5km + Pecho/Tríceps">
              </div>

              <div class="mb-2">
                <label class="form-label">Inicio</label>
                <input id="startAt" type="datetime-local" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Fin</label>
                <input id="endAt" type="datetime-local" class="form-control" required>
                <div class="form-text">Tip: fin debe ser posterior al inicio.</div>
              </div>

              <button class="btn btn-primary w-100" type="submit">Crear</button>
              <div id="msg" class="text-danger small mt-2"></div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm mt-3 pop">
          <div class="card-body d-flex gap-2">
            <button id="reload" class="btn btn-outline-secondary w-100" type="button">Recargar</button>
            <button id="today" class="btn btn-outline-primary w-100" type="button">Hoy</button>
          </div>
        </div>

        <div class="card shadow-sm mt-3 pop">
          <div class="card-body">
            <h6 class="mb-2">Lista rápida</h6>
            <ul id="list" class="list-group small"></ul>
          </div>
        </div>
      </div>

      <!-- Columna derecha: Calendario -->
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm pop">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
              <h5 class="m-0">Calendario</h5>
              <span class="text-muted small">Click en evento: completar / borrar</span>
            </div>

            <!-- ✅ Contenedor obligatorio para FullCalendar -->
            <div id="calendar"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ FullCalendar (ANTES que app.js) -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <!-- Tu JS -->
  <script src="app.js"></script>
</body>
</html>
